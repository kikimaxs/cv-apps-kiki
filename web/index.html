<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description" content="Kiki Triansyah — Software Engineer & Mobile Developer. CV dan portofolio aplikasi (MOLA TV, Durioo+, HadIR, LifelineConnect).">
  <meta property="og:title" content="Kiki Triansyah — Software Engineer & Mobile Developer">
  <meta property="og:description" content="CV dan portofolio aplikasi (MOLA TV, Durioo+, HadIR, LifelineConnect).">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kiki Triansyah">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kiki Triansyah — Software Engineer & Mobile Developer</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Shown until Flutter paints its first frame. The dots wait a quarter of a
       second, so a fast connection never shows them. */
    #app-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: var(--splash-bg, #080D18);
      transition: opacity 0.35s ease;
    }
    #app-splash.gone { opacity: 0; pointer-events: none; }
    #app-splash .dots { display: flex; gap: 9px; opacity: 0; animation: splash-in 0.2s ease 0.25s forwards; }
    #app-splash .dots i {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--splash-dot, #67D4FF);
      animation: splash-pulse 1.1s ease-in-out infinite;
    }
    #app-splash .dots i:nth-child(2) { animation-delay: 0.16s; }
    #app-splash .dots i:nth-child(3) { animation-delay: 0.32s; }
    @keyframes splash-in { to { opacity: 1; } }
    @keyframes splash-pulse {
      0%, 100% { opacity: 0.25; transform: scale(0.75); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-splash .dots i { animation: none; opacity: 0.7; }
    }
  </style>
</head>
<body>
  <div id="app-splash" aria-hidden="true"><div class="dots"><i></i><i></i><i></i></div></div>
  <script>
    // The splash takes the colours of the page being opened.
    (function () {
      var page = location.hash || location.pathname;
      var themes = [
        ['my_portofolio_v2', '#F6F5F1', '#3B5BDB'],
        ['my_portofolio', '#0B1220', '#67D4FF'],
        ['my_cv', '#0F172A', '#67D4FF']
      ];
      for (var i = 0; i < themes.length; i++) {
        if (page.indexOf(themes[i][0]) !== -1) {
          var root = document.documentElement.style;
          root.setProperty('--splash-bg', themes[i][1]);
          root.setProperty('--splash-dot', themes[i][2]);
          break;
        }
      }
      window.addEventListener('flutter-first-frame', function () {
        var splash = document.getElementById('app-splash');
        if (!splash) return;
        splash.classList.add('gone');
        setTimeout(function () { splash.remove(); }, 400);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
