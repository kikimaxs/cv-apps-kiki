name: cv_apps
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.0.0
  get_it: ^7.6.0
  provider: ^6.0.0
  pdf: ^3.11.0
  printing: ^5.13.0
  flutter_svg: ^2.0.10+1
  webview_flutter: ^4.13.1
  url_launcher: ^6.3.2
  webview_flutter_web: ^0.2.3+4
  video_player: ^2.8.2
  flutter_animate: ^4.5.2
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/photo_profile.jpg
    - assets/img/durioo_poster.jpg
    - assets/img/showcase_poster.jpg
    - assets/img/portfolio/
    - assets/svg/
    - assets/svg/skill/
    - assets/video/
  fonts:
    - family: Carlito
      fonts:
        - asset: assets/fonts/Carlito-Regular.ttf
        - asset: assets/fonts/Carlito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Carlito-Italic.ttf
          style: italic
        - asset: assets/fonts/Carlito-BoldItalic.ttf
          weight: 700
          style: italic
